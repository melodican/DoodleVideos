# Finance / money-explainer niche (doodle format). Pairs with config/styles/doodle.yaml.
niche:
  name: "Money, Explained Like You're 5"
  handle: "@money-eli5"
  category: "personal finance"
  scriptwriter_prompt: "prompts/finance_script.md"
  target_minutes: [9, 10]
  rpm_note: "Finance RPM is high (~$5-10, premium niches $10+). Strong monetisation."

# Proven title formulas (reverse-engineered from NexLev top performers)
title_formulas:
  - "What Actually Is {topic}? (Explained Like You're 5)"
  - "If You Don't Understand {topic}, You Don't Understand Money"
  - "How {everyday_thing} Explains {money_idea}"
  - "Once You Learn This, {topic} Becomes Embarrassingly Simple"
  - "Your Life at Every {ladder} — {low} to {high}"

