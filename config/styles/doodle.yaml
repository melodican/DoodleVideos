# Doodle / MS-Paint explainer style (the Axen / Ink Explainer look).
# This is the LOCKED style block appended to every per-timestamp image prompt so
# all frames in a video share one visual language.
style:
  name: "doodle"
  model: "GPT Image 2"
  aspect_ratio: "16:9"
  # Keep a reference image path to pass to Higgsfield for cross-frame consistency.
  reference_image: ""          # optional: path to a locked style reference

  block: |
    STYLE: a simple, charming hand-drawn doodle — black marker linework, like a
    clever person sketching ONE quick idea. Amateur and playful, NOT polished.
    ONE IDEA PER FRAME (most important rule): each image shows a SINGLE clear
    subject or visual metaphor — one object, one stick figure, OR one symbol —
    big and centered, surrounded by lots of empty white space. Do NOT crowd the
    frame with multiple characters or many objects. If the narration mentions
    several things, draw only the SINGLE most important idea. Think road signs:
    instantly readable in one glance. Minimal and uncluttered.
    - White background, thick slightly wobbly black outlines
    - Stick-figure people with round heads, dot eyes, simple faces
    - Simple shapes: one object, an arrow, a box, a symbol
    COLOUR: flat fills only (no shading, gradients, 3D, lighting). Use colour where
    it makes the single subject pop (e.g. an orange sunset, a purple chair); clean
    black line-art on white is also great. Avoid muddy grey frames.
    NO ON-SCREEN TEXT: do NOT write the narration. No sentences, no captions. At
    most ONE bold short label of 1-3 words, spelled correctly, when it genuinely
    helps (e.g. "HUMAN HISTORY"). Otherwise no text.
    AVOID: busy collages, crowds of characters, many objects crammed together,
    anime, Disney, vector art, polished illustration, realism, 3D, textures.
    FORMAT: horizontal 16:9 wide YouTube frame (not vertical, not square).
    SAFE AREA: keep the single subject centered with large EMPTY white margins at
    the very top and very bottom (top ~15% and bottom ~15% blank) — edges are
    cropped. Nothing important near the top or bottom edge.
