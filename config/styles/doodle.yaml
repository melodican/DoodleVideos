# Doodle / MS-Paint explainer style (the Axen / Ink Explainer look).
# This is the LOCKED style block appended to every per-timestamp image prompt so
# all frames in a video share one visual language.
style:
  name: "doodle"
  model: "GPT Image 2"
  aspect_ratio: "16:9"
  # Keep a reference image path to pass to Higgsfield for cross-frame consistency.
  reference_image: ""          # optional: path to a locked style reference

  block: |
    STYLE: a simple, charming hand-drawn doodle — like a clever person sketching
    fast with a black marker plus a few colored markers. Amateur and playful, NOT
    polished or professional.
    - White background
    - Thick, slightly wobbly black outlines
    - Stick-figure people with round heads, dot eyes, simple expressive faces
    - Simple shapes: boxes, circles, arrows, simple buildings, props
    COLOR (important): always add flat colour. Fill the main objects with a few
    bold flat colours (red, blue, green, yellow, orange, brown). Every image must
    have several clearly coloured elements — do NOT leave it mostly black & white.
    No shading, gradients, 3D, or realistic lighting; flat fills only.
    DETAIL: keep it simple but give each frame a little personality and interest —
    an expressive face, one or two relevant props, a small background touch — so it
    is engaging, not empty. Still clearly a quick hand-drawn doodle.
    NO ON-SCREEN TEXT (important): do NOT write the narration on screen. No
    sentences, no captions, no paragraphs of what is being said. Tell the story
    with pictures only. At most an occasional ONE- or TWO-word label on an object
    when truly necessary, spelled correctly — otherwise no text at all.
    AVOID: anime, Disney, cartoon-network style, vector art, polished illustration,
    realism, photoreal, 3D, complex textures.
    FORMAT: horizontal 16:9 wide YouTube frame (not vertical, not square).
    SAFE AREA: keep all content in the central band with large EMPTY white margins
    at the very top and very bottom (top ~15% and bottom ~15% blank), because those
    edges are cropped. Nothing important near the top or bottom edge. Centered,
    clear, no messy overlaps.
