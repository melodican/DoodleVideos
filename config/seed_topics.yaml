# NOT here. The script may only assert claims grounded in this file (or live research).
topics:
  - id: europa_ocean
    subject: "Europa's subsurface ocean"
    object: "Europa"
    place: "Jupiter's moon"
    anchor: "Europa Clipper"
    thumbnail_subject: "cracked icy moon over Jupiter"
    facts:
      - claim: "Europa likely hides a global saltwater ocean beneath its ice shell, possibly holding more than twice the water of all Earth's oceans."
        source_name: "NASA Science — Europa"
        source_url: "https://science.nasa.gov/jupiter/moons/europa/"
      - claim: "NASA's Europa Clipper launched in October 2024 to assess whether Europa could support life."
        source_name: "NASA — Europa Clipper"
        source_url: "https://europa.nasa.gov/"
      - claim: "Europa's surface is crisscrossed by reddish cracks that may carry material from the ocean below."
        source_name: "NASA Science — Europa"
        source_url: "https://science.nasa.gov/jupiter/moons/europa/"

